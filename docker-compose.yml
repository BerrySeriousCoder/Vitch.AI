services:
  postgres:
    image: postgres:16-alpine
    container_name: tempo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tempo
    ports:
      - "5432:5432"
    volumes:
      - tempo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tempo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - tempo_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tempo_pgdata:
  tempo_redis:
